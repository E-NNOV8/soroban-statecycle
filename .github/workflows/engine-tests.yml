name: StateCycle checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Stellar CLI for offline XDR verification
        run: |
          bash scripts/install_stellar.sh "$RUNNER_TEMP/stellar-bin"
          echo "$RUNNER_TEMP/stellar-bin" >> "$GITHUB_PATH"
      - name: All behavior tests and compilation
        run: bash scripts/check.sh
      - name: Retained hashes, references and offline evidence replay
        run: python3 scripts/verify_evidence.py
      - name: Retained hosted provenance and raw replay
        run: python3 scripts/verify_hosted_evidence.py
      - name: Lightweight fresh-checkout sanity
        run: python3 scripts/check_reproducibility.py
